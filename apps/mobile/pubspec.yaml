name: locz
description: LocZ — location-first local discovery for India.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — the brief specifies Riverpod.
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing with deep-link support (locz://ad/<slug> and https://locz.in/ad/<slug>).
  go_router: ^14.6.2

  # Networking. Dio is chosen over http for interceptors: token refresh and correlation
  # ids belong in one place rather than at every call site.
  dio: ^5.7.0

  # Tokens are kept in the Keystore / Keychain, never in shared preferences.
  # Device lock (fingerprint, face, or the phone's own PIN/pattern) used to gate
  # access to a signed-in session. See core/security/device_lock.dart.
  local_auth: ^2.3.0
  # Reports this build's own versionCode, which the update check compares against
  # the published manifest. See core/update/app_update.dart.
  package_info_plus: ^8.1.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3

  geolocator: ^13.0.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: 2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app-icon-1024.png
  adaptive_icon_background: '#F7F3EA'
  adaptive_icon_foreground: assets/brand/locz-mark.png
  adaptive_icon_foreground_inset: 18
  adaptive_icon_monochrome: assets/brand/locz-mark.png
  remove_alpha_ios: true

flutter_native_splash:
  color: '#F7F3EA'
  image: assets/brand/locz-mark.png
  android: true
  ios: true
  web: false
  android_12:
    color: '#F7F3EA'
    image: assets/brand/locz-mark.png
    icon_background_color: '#F7F3EA'

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
