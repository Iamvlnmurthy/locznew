events {
  worker_connections 128;
}

http {
  server {
    listen 80;
    server_name locz.in www.locz.in admin.locz.in;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 503 "LocZ is preparing a secure connection.\n";
      add_header Content-Type text/plain;
    }
  }
}
