user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # $request_id is echoed as X-Correlation-Id so a user-reported failure can be traced
  # from this log line through the API and into the audit trail.
  log_format locz '$remote_addr - $request_id [$time_local] "$request" '
                  '$status $body_bytes_sent rt=$request_time '
                  'ua="$http_user_agent"';
  access_log /var/log/nginx/access.log locz;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # A phone on a patchy connection uploading a listing photo needs room; the API
  # enforces its own per-file limit on top of this.
  client_max_body_size 12m;
  client_body_timeout 60s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             application/xml text/xml application/rss+xml image/svg+xml;

  # Rate-limit zones. The API applies per-user and per-phone limits of its own; these
  # are the crude edge brakes that stop a flood reaching Node at all.
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  # nginx answers a throttled request with 503 by default, which says "the service is
  # broken" when the truth is "you are going too fast". The API already answers 429 for
  # its own limits, and clients back off on 429 — the two layers must not disagree about
  # what the same event is called.
  limit_req_status 429;
  limit_conn_status 429;

  upstream locz_api    { server api:4000;   keepalive 32; }
  upstream locz_web    { server web:3000;   keepalive 32; }
  upstream locz_admin  { server admin:3000; keepalive 16; }

  # Plain HTTP redirects to HTTPS, except the ACME challenge path.
  server {
    listen 80;
    server_name locz.in www.locz.in admin.locz.in;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---------------------------------------------------------------------------
  # Public site + API
  # ---------------------------------------------------------------------------
  server {
    listen 443 ssl;
    http2 on;
    server_name locz.in www.locz.in;

    ssl_certificate     /etc/letsencrypt/live/locz.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locz.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_conn conn_per_ip 40;

    # OTP endpoints get their own, much tighter bucket: each request costs real money
    # in SMS and is the obvious target for abuse.
    location /api/v1/auth/otp/ {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://locz_api;
      include /etc/nginx/proxy_params_locz;
    }

    location /api/ {
      limit_req zone=api_general burst=40 nodelay;
      proxy_pass http://locz_api;
      include /etc/nginx/proxy_params_locz;
    }

    # Next.js build output is content-hashed and safe to cache forever.
    location /_next/static/ {
      proxy_pass http://locz_web;
      include /etc/nginx/proxy_params_locz;
      proxy_cache_valid 200 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://locz_web;
      include /etc/nginx/proxy_params_locz;
    }
  }

  # ---------------------------------------------------------------------------
  # Admin console — separate hostname so a cookie set here never reaches the public site
  # ---------------------------------------------------------------------------
  server {
    listen 443 ssl;
    http2 on;
    server_name admin.locz.in;

    ssl_certificate     /etc/letsencrypt/live/locz.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locz.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    # Set on the public site and omitted here, which was backwards: this is the host that
    # serves unmoderated user content to staff.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Moderators handle abusive content; the console must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
      limit_req zone=api_general burst=60 nodelay;
      proxy_pass http://locz_api;
      include /etc/nginx/proxy_params_locz;
    }

    location / {
      proxy_pass http://locz_admin;
      include /etc/nginx/proxy_params_locz;
    }
  }
}
