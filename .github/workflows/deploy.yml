name: Build & Deploy

# Builds web + api on a clean Linux runner (NOT the prod box) and ships the finished artifacts to
# the VPS. This removes the two things that caused the outages: `next build`/`nest build` no longer
# runs on the 15GB box (no more OOM-killing Postgres), and argon2 is rebuilt from source on deploy
# (no more silent core-dump). See docs/CI_DEPLOY_SETUP.md for the one-time secret setup.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @locz/api

      - name: Build api + web + admin (off-box)
        env:
          NODE_ENV: production
        run: |
          npm run build -w @locz/api
          npm run build -w @locz/web
          npm run build -w @locz/admin

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Don't gate the deploy on a host-key SCAN: ssh-keyscan returning non-zero (a transient
          # network flake from the runner) was killing the whole step under `bash -e`. Let the real
          # ssh/rsync connections learn the host key on first use instead.
          # GitHub runners intermittently time out connecting to the VPS on :22 (a runner↔VPS network
          # flake, not auth), which failed the deploy and needed a manual re-run. ConnectionAttempts
          # makes ssh (and rsync, which shells out to ssh) retry the CONNECT a few times on its own;
          # the short ConnectTimeout means a dead attempt gives up quickly and retries sooner. The
          # keepalives drop a mid-command stall instead of hanging the whole job.
          {
            printf 'Host *\n'
            printf '  StrictHostKeyChecking accept-new\n'
            printf '  IdentityFile ~/.ssh/id_deploy\n'
            printf '  ConnectTimeout 20\n'
            printf '  ConnectionAttempts 4\n'
            printf '  ServerAliveInterval 15\n'
            printf '  ServerAliveCountMax 4\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sync source to the exact deployed commit
        run: |
          # Retry across a longer network blip (beyond ssh's own ConnectionAttempts) so a transient
          # runner↔VPS timeout doesn't fail the whole deploy and force a manual re-run.
          for attempt in 1 2 3; do
            if ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
                 "sudo -u locz bash -lc 'cd /home/locz/app && git fetch origin master -q && git reset --hard ${{ github.sha }} -q'"; then
              exit 0
            fi
            echo "sync attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          echo "sync failed after 3 attempts"; exit 1

      - name: Ship prebuilt artifacts (.next + api dist)
        run: |
          # rsync the runner-built output over the top of the reset tree, so the box never builds.
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            apps/api/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/locz/app/apps/api/dist/
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            apps/web/.next/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/locz/app/apps/web/.next/
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            apps/admin/.next/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/locz/app/apps/admin/.next/
          # rsync connects as the restricted deploy account, while PM2 runs all applications as
          # `locz`. Next must be able to create its runtime fetch cache, so ownership has to be
          # corrected by sudo rather than by the later `sudo -u locz` shell (which cannot chown
          # files owned by the deploy account).
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo chown -R locz:locz /home/locz/app/apps/web/.next /home/locz/app/apps/admin/.next /home/locz/app/apps/api/dist"

      - name: Install runtime deps + argon2 rebuild + restart
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'sudo -u locz bash -lc "
            cd /home/locz/app &&
            npm install >/tmp/ci-install.log 2>&1 &&
            npm rebuild argon2 --build-from-source >/tmp/ci-argon2.log 2>&1 &&
            npm run db:generate -w @locz/api >/tmp/ci-gen.log 2>&1 &&
            pm2 restart locz-api locz-web locz-admin --update-env >/dev/null 2>&1 &&
            echo restarted
          "'

      - name: Health check
        run: |
          sleep 8
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 https://locz.in/)
          echo "site returned $code"
          api_code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 https://api.locz.in/api/v1/health/ready)
          echo "api readiness returned $api_code"
          admin_code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 https://admin.locz.in/login)
          echo "admin returned $admin_code"
          test "$code" = "200" && test "$api_code" = "200" && test "$admin_code" = "200"
